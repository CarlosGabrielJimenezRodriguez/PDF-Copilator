<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroDoc Scanner - QC Tool v4</title>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js](https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js)"></script>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #27ae60;
            --action-color: #2980b9;
            --bg-color: #f5f6fa;
            --text-color: #333;
            --ine-color: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 2rem; }

        .header { background-color: var(--primary-color); color: white; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h1 { font-size: 1.5rem; }
        .container { max-width: 800px; margin: 1rem auto; padding: 0 1rem; }
        
        .control-panel, .ine-panel { background: white; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ine-panel { border: 2px solid var(--ine-color); }
        .panel-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; color: var(--primary-color); display: flex; align-items: center; gap: 8px;}
        .ine-panel .panel-title { color: var(--ine-color); }

        .row-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.25rem; font-size: 0.9rem; }
        select, input[type="text"] { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }

        .action-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        
        .btn { flex: 1; padding: 0.8rem; border: none; border-radius: 4px; font-size: 0.9rem; font-weight: bold; cursor: pointer; text-align: center; min-width: 120px; color: white; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 5px;}
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-primary { background-color: var(--accent-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .btn-ine { background-color: var(--ine-color); }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); 
            gap: 10px; 
            margin-top: 1rem; 
        }
        
        .image-card { 
            position: relative; 
            border-radius: 6px; 
            overflow: hidden; 
            aspect-ratio: 3/4; 
            border: 2px solid #ddd; 
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-card img { max-width: 100%; max-height: 100%; object-fit: contain; } 
        
        .image-number { position: absolute; top: 3px; left: 3px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; z-index: 10; }
        .remove-btn { position: absolute; top: 3px; right: 3px; background: rgba(231, 76, 60, 0.9); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; z-index: 10; font-size: 0.8rem;}
        .reorder-btns { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; background: rgba(0,0,0,0.6); padding: 2px; z-index: 10;}
        .btn-move { background: none; border: none; color: white; padding: 2px 6px; cursor: pointer; font-size: 1rem; }

        .preview-section h3 { font-size: 1.1rem; margin-top: 1.5rem; color: var(--primary-color); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: white; text-align: center; padding: 20px;}
        .hidden { display: none !important; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <h1>AeroDoc Scanner</h1>
    </header>

    <main class="container">
        <!-- PANEL NORMAL -->
        <section class="control-panel">
            <div class="row-group">
                <div class="form-group" style="flex: 100%;">
                    <label>Nombre del Documento:</label>
                    <input type="text" id="fileNameInput" value="Reporte_Escaneado">
                </div>
                <div class="form-group">
                    <label>Tamaño Hoja:</label>
                    <select id="formatSelect">
                        <option value="letter" selected>Carta (Letter)</option>
                        <option value="legal">Oficio (Legal)</option>
                        <option value="a4">A4 (Estándar)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Calidad:</label>
                    <select id="qualitySelect">
                        <option value="low">Bajo (Rápido)</option>
                        <option value="medium" selected>Medio</option>
                        <option value="high">Alto (Lento)</option>
                    </select>
                </div>
            </div>

            <div class="action-buttons">
                <label for="fileInput" class="btn btn-secondary">📂 Subir Documentos Normales</label>
                <input type="file" id="fileInput" accept="image/*" multiple hidden>
            </div>
        </section>

        <!-- PANEL INE DIRECTO -->
        <section class="ine-panel">
            <div class="panel-title">💳 Modo Identificación (Unir Frente y Vuelta)</div>
            <p style="font-size: 0.85rem; margin-bottom: 1rem; color: #666;">Selecciona las 2 imágenes. El programa mantendrá su tamaño original acomodando una en la mitad de arriba y otra en la mitad de abajo.</p>
            <div class="action-buttons">
                <button id="ineFrontBtn" class="btn btn-ine">📂 Paso 1: Subir Frente</button>
                <button id="ineBackBtn" class="btn btn-ine" disabled>📂 Paso 2: Subir Vuelta</button>
                <input type="file" id="ineFileInput" accept="image/*" hidden>
            </div>
        </section>
        
        <button id="generatePdfBtn" class="btn btn-primary" disabled style="width:100%; margin-top: 1rem; font-size: 1.1rem; padding: 1rem;">📄 Generar y Descargar PDF</button>

        <section class="preview-section">
            <h3>Páginas del Documento (<span id="imageCount">0</span>)</h3>
            <div id="previewGallery" class="gallery"></div>
        </section>
    </main>

    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <p id="loadingText">Procesando...</p>
    </div>

    <script>
        let selectedDocuments = []; 
        let tempIneFront = null;
        let ineProcessingSide = null; 

        const ui = {
            fileInput: document.getElementById('fileInput'),
            previewGallery: document.getElementById('previewGallery'),
            generatePdfBtn: document.getElementById('generatePdfBtn'),
            qualitySelect: document.getElementById('qualitySelect'),
            formatSelect: document.getElementById('formatSelect'),
            fileNameInput: document.getElementById('fileNameInput'),
            imageCountLabel: document.getElementById('imageCount'),
            loading: document.getElementById('loadingOverlay'),
            loadingText: document.getElementById('loadingText'),
            ineFileInput: document.getElementById('ineFileInput'),
            ineFrontBtn: document.getElementById('ineFrontBtn'),
            ineBackBtn: document.getElementById('ineBackBtn')
        };

        // 1. GALERÍA NORMAL
        ui.fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    selectedDocuments.push({ file: file, type: 'normal', id: Date.now() + Math.random() });
                }
            });
            renderGallery();
            ui.fileInput.value = ''; 
        });

        function renderGallery() {
            ui.previewGallery.innerHTML = ''; 
            const total = selectedDocuments.length;
            ui.imageCountLabel.textContent = total;
            ui.generatePdfBtn.disabled = total === 0;

            selectedDocuments.forEach((doc, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                if(doc.type === 'ine') card.style.borderColor = 'var(--ine-color)';

                const numBadge = document.createElement('div');
                numBadge.className = 'image-number';
                numBadge.textContent = index + 1;
                card.appendChild(numBadge);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = 'X';
                removeBtn.onclick = () => { selectedDocuments.splice(index, 1); renderGallery(); };
                card.appendChild(removeBtn);

                const img = document.createElement('img');
                const reader = new FileReader();
                reader.onload = (e) => img.src = e.target.result;
                reader.readAsDataURL(doc.file); 
                card.appendChild(img);
                
                const reorderDiv = document.createElement('div');
                reorderDiv.className = 'reorder-btns';
                
                const moveLeft = document.createElement('button');
                moveLeft.className = 'btn-move';
                moveLeft.textContent = '◀';
                moveLeft.onclick = () => {
                    if (index > 0) {
                        [selectedDocuments[index], selectedDocuments[index-1]] = [selectedDocuments[index-1], selectedDocuments[index]];
                        renderGallery();
                    }
                };
                
                const moveRight = document.createElement('button');
                moveRight.className = 'btn-move';
                moveRight.textContent = '▶';
                moveRight.onclick = () => {
                    if (index < total - 1) {
                        [selectedDocuments[index], selectedDocuments[index+1]] = [selectedDocuments[index+1], selectedDocuments[index]];
                        renderGallery();
                    }
                };

                if (index === 0) moveLeft.style.visibility = 'hidden';
                if (index === total - 1) moveRight.style.visibility = 'hidden';

                reorderDiv.appendChild(moveLeft);
                reorderDiv.appendChild(moveRight);
                card.appendChild(reorderDiv);
                ui.previewGallery.appendChild(card);
            });
        }

        // 2. MODO IDENTIFICACIÓN (Simplificado solo a archivos)
        ui.ineFrontBtn.addEventListener('click', () => {
            ineProcessingSide = 'front';
            ui.ineFileInput.click(); 
        });

        ui.ineBackBtn.addEventListener('click', () => {
            ineProcessingSide = 'back';
            ui.ineFileInput.click(); 
        });

        ui.ineFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (ineProcessingSide === 'front') {
                tempIneFront = file;
                ui.ineFrontBtn.classList.replace('btn-ine', 'btn-secondary');
                ui.ineFrontBtn.textContent = "✅ Frente Subido";
                ui.ineBackBtn.disabled = false; 
            } else if (ineProcessingSide === 'back') {
                showLoading("Uniendo ambas mitades en una hoja...");
                try {
                    const finalInePageBlob = await combineIneImages(tempIneFront, file);
                    
                    selectedDocuments.push({ file: finalInePageBlob, type: 'ine', id: Date.now() + Math.random() });
                    renderGallery();
                    
                    // Resetear panel
                    tempIneFront = null;
                    ineProcessingSide = null;
                    ui.ineFrontBtn.classList.replace('btn-secondary', 'btn-ine');
                    ui.ineFrontBtn.textContent = "📂 Paso 1: Subir Frente";
                    ui.ineBackBtn.disabled = true;
                } catch(err) {
                    console.error(err);
                    alert("Error al unir las imágenes de la identificación.");
                }
                hideLoading();
            }
            ui.ineFileInput.value = ''; 
        });

        // LÓGICA PRINCIPAL: Corta visualmente la hoja en 2 mitades manteniendo tamaño original
        async function combineIneImages(frontBlob, backBlob) {
            const imgFront = await blobToImage(frontBlob);
            const imgBack = await blobToImage(backBlob);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Tamaño Hoja Carta estándar a 300DPI (2550 x 3300 pixeles)
            canvas.width = 2550;
            canvas.height = 3300;

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let wFront = imgFront.width;
            let hFront = imgFront.height;
            let wBack = imgBack.width;
            let hBack = imgBack.height;

            // Seguridad: Solo reducimos si la foto es gigantesca y se saldría de su mitad de la hoja
            const maxWidth = canvas.width * 0.9;
            const maxHeight = (canvas.height / 2) * 0.9;

            if (wFront > maxWidth || hFront > maxHeight) {
                const scale = Math.min(maxWidth / wFront, maxHeight / hFront);
                wFront *= scale; hFront *= scale;
            }
            if (wBack > maxWidth || hBack > maxHeight) {
                const scale = Math.min(maxWidth / wBack, maxHeight / hBack);
                wBack *= scale; hBack *= scale;
            }

            // Mitad de arriba (calcula el centro de la parte superior del canvas)
            const posXFront = (canvas.width - wFront) / 2;
            const posYFront = (canvas.height / 2 - hFront) / 2;

            // Mitad de abajo (calcula el centro de la parte inferior del canvas)
            const posXBack = (canvas.width - wBack) / 2;
            const posYBack = (canvas.height / 2) + (canvas.height / 2 - hBack) / 2;

            ctx.drawImage(imgFront, posXFront, posYFront, wFront, hFront);
            ctx.drawImage(imgBack, posXBack, posYBack, wBack, hBack);

            return new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
        }

        function blobToImage(blob) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = URL.createObjectURL(blob);
            });
        }

        // 3. GENERACIÓN DEL PDF (Sin Cambios)
        ui.generatePdfBtn.addEventListener('click', async () => {
            if (selectedDocuments.length === 0) return;
            showLoading("Generando PDF de alta calidad...");
            
            try {
                const { jsPDF } = window.jspdf;
                const format = ui.formatSelect.value;
                const quality = ui.qualitySelect.value;
                
                const config = {
                    low: { maxW: 1000, q: 0.6 },
                    medium: { maxW: 1600, q: 0.8 },
                    high: { maxW: 2400, q: 0.95 }
                }[quality];

                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: format, compress: quality !== 'high' });
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                for (let i = 0; i < selectedDocuments.length; i++) {
                    ui.loadingText.textContent = `Procesando página ${i+1} de ${selectedDocuments.length}...`;
                    const doc = selectedDocuments[i];
                    
                    const imgDataUrl = await compressImage(doc.file, config.maxW, config.q);
                    if (i > 0) pdf.addPage(format, 'portrait');
                    
                    const alias = quality === 'high' ? 'SLOW' : 'FAST';
                    pdf.addImage(imgDataUrl, 'JPEG', 0, 0, pageWidth, pageHeight, undefined, alias);
                }

                const fileName = ui.fileNameInput.value.replace(/[^a-z0-9]/gi, '_') + ".pdf";
                pdf.save(fileName);

            } catch (error) {
                console.error(error);
                alert("Ocurrió un error al generar el PDF.");
            } finally {
                hideLoading();
            }
        });

        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height = height * (maxWidth / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = "white";
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        function showLoading(text) { ui.loadingText.textContent = text; ui.loading.classList.remove('hidden'); }
        function hideLoading() { ui.loading.classList.add('hidden'); }
    </script>
</body>
</html>
